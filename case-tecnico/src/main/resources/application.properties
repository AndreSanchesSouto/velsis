# ===================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ===================================================================
# Nome do projeto que identifica a aplicação dentro do ecossistema Spring
spring.application.name=case-tecnico

# Configuração que ajuda o Spring a ler cabeçalhos proxy (como X-Forwarded-For) de forma segura.
# Essencial quando a aplicação roda atrás de um proxy reverso (como Nginx) ou gateways de contêineres.
server.forward-headers-strategy=framework

# ===================================================================
# SEGURANÇA E CONFIGURAÇÕES JWT
# ===================================================================
# Chave secreta usada para assinar os tokens JWT. Deve ter pelo menos 256 bits (32 caracteres).
jwt.secret=secret-for-local-development-only-123456

# Tempo de expiração do token JWT em milissegundos (3600000ms = 1 hora)
jwt.expiration=3600000

# ===================================================================
# CONFIGURAÇÃO DE BANCO DE DADOS (H2 - DESATIVADO)
# ===================================================================
# As linhas abaixo para banco em memória H2 foram comentadas e estão inativas
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# ===================================================================
# CONFIGURAÇÃO DE BANCO DE DADOS (POSTGRESQL - ATIVO)
# ===================================================================
# URL de conexão. O host 'database' aponta para o nome do serviço definido no docker-compose
spring.datasource.url=jdbc:postgresql://database:5432/case_tecnico
spring.datasource.username=postgres
spring.datasource.password=postgres

# Dialeto específico que traduz as instruções JPQL do Hibernate para a sintaxe nativa do PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURAÇÕES DO JPARepository E HIBERNATE
# ===================================================================
# Altera ou cria automaticamente as tabelas no banco de dados baseado nas entidades Java.
# Bom para desenvolvimento, mas deve ser evitado ou alterado para 'validate' ou 'none' em produção.
spring.jpa.hibernate.ddl-auto=update

# Ativa a exibição de todas as instruções SQL executadas no console da aplicação
spring.jpa.show-sql=true

# Formata as linhas de código SQL no console para que fiquem legíveis (com quebras de linha e identação)
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING (GERENCIAMENTO DE LOGS)
# ===================================================================
# Define o nível do log para detalhar todas as operações que envolvem a sintaxe SQL gerada pelo Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Define o nível de log para exibir os parâmetros exatos (valores reais das variáveis) passados para as queries.
# Ajuda no debug para descobrir exatamente o valor que está preenchendo as interrogações (?) do SQL.
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
