# ===================================================================
# CONFIGURACOES GERAIS DA APLICACAO
# ===================================================================
# Nome do projeto que identifica a aplicacao dentro do ecossistema Spring
spring.application.name=case-tecnico

# Configuracao que ajuda o Spring a ler cabecalhos proxy (como X-Forwarded-For) de forma segura.
# Essencial quando a aplicacao roda atras de um proxy reverso (como Nginx) ou gateways de conteineres.
server.forward-headers-strategy=framework

# ===================================================================
# SEGURANCA E CONFIGURACOES JWT
# ===================================================================
# Chave secreta usada para assinar os tokens JWT. Deve ter pelo menos 256 bits (32 caracteres).
jwt.secret=secret-for-local-development-only-123456

# Tempo de expiracao do token JWT em milissegundos (3600000ms = 1 hora)
jwt.expiration=3600000

# ===================================================================
# CONFIGURACAO DE BANCO DE DADOS (H2 - DESATIVADO)
# ===================================================================
# As linhas abaixo para banco em memoria H2 foram comentadas e estao inativas
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# ===================================================================
# CONFIGURACAO DE BANCO DE DADOS (POSTGRESQL - ATIVO)
# ===================================================================
# URL de conexao. O host 'database' aponta para o nome do servico definido no docker-compose
spring.datasource.url=jdbc:postgresql://database:5432/case_tecnico
spring.datasource.username=postgres
spring.datasource.password=postgres
#
# Dialeto especifico que traduz as instrucoes JPQL do Hibernate para a sintaxe nativa do PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACOES DO JPARepository E HIBERNATE
# ===================================================================
# Altera ou cria automaticamente as tabelas no banco de dados baseado nas entidades Java.
# Bom para desenvolvimento, mas deve ser evitado ou alterado para 'validate' ou 'none' em producao.
spring.jpa.hibernate.ddl-auto=update

# Ativa a exibicao de todas as instrucoes SQL executadas no console da aplicacao
spring.jpa.show-sql=true

# Formata as linhas de codigo SQL no console para que fiquem legiveis (com quebras de linha e identacao)
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING (GERENCIAMENTO DE LOGS)
# ===================================================================
# Define o nivel do log para detalhar todas as operacoes que envolvem a sintaxe SQL gerada pelo Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Define o nivel de log para exibir os parametros exatos (valores reais das variaveis) passados para as queries.
# Ajuda no debug para descobrir exatamente o valor que esta preenchendo as interrogacoes (?) do SQL.
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
